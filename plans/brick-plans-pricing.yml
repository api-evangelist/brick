note: >-
  This file REPLACES a scaffold written by the 2026-05-04 bulk sweep that invented Free / Professional
  / Enterprise tiers with 1,000 and 100,000 request monthly quotas and TBD overage pricing. None of
  that ever existed. Brick's only commercial surface is the Brick Consortium
  (https://brickschema.org/consortium/), which is organisational membership in the standards body —
  not an API plan — and it publishes no membership fee schedule.
