description: >-
  Brick publishes no plans, tiers, quotas or prices. It is a BSD-3-Clause open-source ontology
  distributed as files, with a self-hostable reference server; there is no hosted API to meter and
  nothing to buy. There is no pricing page, no sign-up, and no billing surface on any Brick host.
