openapi: 3.2.0
info:
  title: Brick Server Raw Queries API
  version: 0.1.0
tags:
- name: Raw Queries
paths:
  /brickapi/v1/rawqueries/timeseries:
    post:
      tags:
      - Raw Queries
      summary: Post
      description: Raw PostgreSQL query for timeseries. (May not be exposed in the production deployment.)
      operationId: post_brickapi_v1_rawqueries_timeseries_post
      requestBody:
        content:
          application/sql:
            schema:
              title: Query
              type: string
              description: A raw SQL query for timeseries data. The table consist of the columns as in `value_types`.
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /brickapi/v1/rawqueries/sparql:
    post:
      tags:
      - Raw Queries
      summary: Post
      description: Raw SPARQL for Brick metadata. (May not be exposed in the production deployment.
      operationId: post_brickapi_v1_rawqueries_sparql_post
      requestBody:
        content:
          application/sparql-query:
            schema:
              title: Query
              type: string
              description: A raw SPARQL query.
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Post Brickapi V1 Rawqueries Sparql Post
                type: object
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            type: string
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
