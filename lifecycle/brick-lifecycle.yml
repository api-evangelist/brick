versioning:
  scheme: semver
  current: 1.4.4
  namespace_policy: >-
    "Since v1.2, all versions of the Brick ontology have the same namespace:
    https://brickschema.org/schema/Brick#" — the namespace is deliberately unversioned so a model can
    be upgraded by loading a newer graph rather than rewriting every entity IRI.
  version_signal: >-
    Version is carried by the IRI of the IMPORTED graph, not the namespace: a model declares
    owl:imports <https://brickschema.org/schema/1.4/Brick> to pin the ontology release it was authored
    against.
  api_versioning: >-
    The Brick Example Server contract versions in the path — every operation sits under /brickapi/v1/.
deprecation:
  policy_published: false
  in_graph_signal:
    property: brick:isReplacedBy
    label: Is replaced by
    note: >-
      The ontology carries its own machine-readable succession pointer — a retired or renamed term is
      linked to its successor with brick:isReplacedBy — and every release ships a generated list of
      REMOVED classes. That is the closest thing Brick publishes to a deprecation signal.
  gap: >-
    docs.brickschema.org/lifecycle/versioning.html is silent on backwards-compatibility guarantees,
    class deprecation procedure, support windows and what a major/minor/patch bump means. There is no
    Sunset or Deprecation HTTP header surface, because Brick operates no hosted API. Verified
    2026-09-04.
sla:
  published: false
  note: No SLA is published; Brick is a BSD-3-Clause community standard with no hosted service.
status_page:
